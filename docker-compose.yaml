services:
  postgres:
    image: postgres:alpine
    ports:
      - 5432:5432
    volumes:
      - cronos_volume:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: cronos_db
  redis:
    image: redis:alpine
    ports:
      - 6379:6379
volumes:
  cronos_volume: